name: Auditar cobertura das competições
on:
  push:
    branches: [main]
    paths: [.github/workflows/auditar-cobertura.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar temporadas liberadas pelo plano gratuito
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          """Discover and verify the seasons actually permitted by the free API account."""
          import datetime,json,pathlib,os,re,time,urllib.request,urllib.parse
          OUT=pathlib.Path('coverage-audit');OUT.mkdir(exist_ok=True)
          key=os.environ.get('API_FOOTBALL_KEY');calls=0
          if not key:raise SystemExit('Configure the GitHub Actions secret API_FOOTBALL_KEY.')
          def get(endpoint,params):
           global calls
           if calls>=55:raise RuntimeError('Audit request limit reached')
           if calls:time.sleep(6.2)
           request=urllib.request.Request('https://v3.football.api-sports.io/'+endpoint+'?'+urllib.parse.urlencode(params),headers={'x-apisports-key':key})
           calls+=1
           body=json.load(urllib.request.urlopen(request,timeout=30))
           errors=body.get('errors') or {}
           # Keep the plan explanation, while excluding the credential from any artifact/log.
           errors=json.loads(json.dumps(errors).replace(key,'[REDACTED]'))
           return body.get('response',[]),errors
          leagues=[];catalog_errors=[]
          for country in ['Brazil','World']:
           rows,errors=get('leagues',{'country':country});leagues.extend(rows)
           if errors:catalog_errors.append({'country':country,'errors':errors})
          (OUT/'provider-coverage.json').write_text(json.dumps(leagues,ensure_ascii=False))
          _,plan_error=get('fixtures',{'league':71,'season':2026,'timezone':'America/Sao_Paulo'})
          message=str(plan_error.get('plan','')) if isinstance(plan_error,dict) else ''
          bounds=re.search(r'\b(20\d{2})\s*(?:to|and|a|até|-)\s*(20\d{2})\b',message,re.I)
          if bounds and 0<=int(bounds[2])-int(bounds[1])<=10:
           years=list(range(int(bounds[1]),int(bounds[2])+1))[-3:];selection='range_reported_by_provider'
          else:years=[2022,2023,2024];selection='candidate_years_not_yet_verified'
          probes=[]
          for name in ['Serie A','Copa Do Brasil','CONMEBOL Libertadores','CONMEBOL Sudamericana','Paulista - A1','Carioca - 1','Mineiro - 1','Gaúcho - 1']:
           league=next((x for x in leagues if x['league']['name'].casefold()==name.casefold()),None)
           if not league:probes.append({'competition':name,'status':'not_found'});continue
           for year in years:
            if not any(s['year']==year for s in league['seasons']):probes.append({'competition':name,'year':year,'status':'not_advertised'});continue
            fixtures,errors=get('fixtures',{'league':league['league']['id'],'season':year,'status':'FT-AET-PEN','timezone':'America/Sao_Paulo'})
            p={'competition':name,'league_id':league['league']['id'],'year':year,'fixtures':len(fixtures),'errors':errors,'status':'accessible_sample' if fixtures and not errors else 'blocked_or_empty'}
            if fixtures:
             fid=sorted(fixtures,key=lambda f:f['fixture']['date'],reverse=True)[0]['fixture']['id']
             lineup,errors=get('fixtures/lineups',{'fixture':fid})
             p.update(sample_fixture_id=fid,sample_coach_sides=len({r['team']['id'] for r in lineup if r.get('coach',{}).get('id') and r.get('coach',{}).get('name')}),lineup_errors=errors)
             (OUT/f'fixtures-{league["league"]["id"]}-{year}.json').write_text(json.dumps(fixtures,ensure_ascii=False))
             (OUT/f'lineup-{fid}.json').write_text(json.dumps(lineup,ensure_ascii=False))
            probes.append(p)
          report={'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':calls,'catalog_errors':catalog_errors,'current_season_plan_response':plan_error,'tested_years':years,'year_selection':selection,'probes':probes,'successful_fixture_queries':sum(p.get('fixtures',0)>0 and not p.get('errors') for p in probes),'all_competitions_ready':False}
          (OUT/'audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'requests':calls,'tested_years':years,'successful_fixture_queries':report['successful_fixture_queries'],'all_competitions_ready':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-audit
          path: coverage-audit/
          if-no-files-found: error
